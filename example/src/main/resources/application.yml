server:
  port: ${SERVER_PORT:8080}

# spring config
spring:
  application:
    name: service-bridge-example
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/service_bridge?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:service_bridge}
    password: ${MYSQL_PASSWORD:service_bridge}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema-mysql.sql
        - classpath:db/service-bridge-schema-mysql.sql

bedrock:
  mq:
    db-dialect: mysql
    node-id: ${BEDROCK_NODE_ID:service-bridge-example-1}
    poll-interval-ms: 500
    processing-timeout-minutes: 15

service:
  bridge:
    mq:
      provider: bedrock
    request-topic: ${SERVICE_BRIDGE_REQUEST_TOPIC:service-bridge.request}
    response-topic: ${SERVICE_BRIDGE_RESPONSE_TOPIC:service-bridge.response}
    client:
      timeout: 60s
      redis-channel: ${spring.application.name}:service-bridge:completed
    server:
      processing-timeout: 15m
      recovery-enabled: true
