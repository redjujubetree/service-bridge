server:
  port: ${SERVER_PORT:9999}

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:service-bridge-example-server}
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3307/service_bridge?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:12345678}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      schema-locations:
        - classpath:schema-mysql.sql
        - classpath:db/service-bridge-schema-mysql.sql

bedrock:
  mq:
    db-dialect: mysql
    node-id: ${BEDROCK_NODE_ID:service-bridge-example-server-1}
    poll-interval-ms: 500
    processing-timeout-minutes: 15

service:
  bridge:
    request-topic: ${SERVICE_BRIDGE_REQUEST_TOPIC:service-bridge.request}
    response-topic: ${SERVICE_BRIDGE_RESPONSE_TOPIC:service-bridge.response}
    mq:
      provider: bedrock
    server:
      processing-timeout: ${BRIDGE_PROCESSING_TIMEOUT:15m}
      recovery-enabled: ${BRIDGE_RECOVERY_ENABLED:true}
ocr:
  url: ${OCR_SERVICE_URL:http://localhost:8080/ocr}
  invoice-parser-script: ${INVOICE_PARSER_SCRIPT:C:/Users/_Aurora/Desktop/workspace/service-bridge/example/example-server/src/main/resources/python/invoice_parser.py}