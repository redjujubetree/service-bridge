services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: service_bridge
      MYSQL_USER: service_bridge
      MYSQL_PASSWORD: service_bridge
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uservice_bridge", "-pservice_bridge"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - service-bridge-mysql:/var/lib/mysql

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  service-bridge-mysql:
